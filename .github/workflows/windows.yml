name: Windows

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Qt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/Qt
          key: qt-6.8.3-msvc2022-x64

      - name: Build, test, and package
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "dev-$env:GITHUB_SHA".Substring(0, 12)
          }
          .\windows\build.ps1 -Version $version

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omawrite-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download the Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: omawrite-windows-x64
          path: release

      - name: Create checksum
        shell: powershell
        run: |
          $zip = Get-ChildItem -LiteralPath release -Filter *.zip -File -Recurse |
            Select-Object -Single
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($zip.FullName + ".sha256") `
            -Value "$hash  $($zip.Name)" -Encoding Ascii

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem -LiteralPath release -Filter *.zip -File -Recurse |
            Select-Object -Single
          gh release create $env:GITHUB_REF_NAME `
            $zip.FullName ($zip.FullName + ".sha256") `
            --title "OmaWrite for Windows $env:GITHUB_REF_NAME" `
            --generate-notes
