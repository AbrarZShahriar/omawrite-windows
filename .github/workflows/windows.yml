name: Windows

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Check out the source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Qt
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/Qt
          key: qt-6.8.3-msvc2022-x64

      - name: Build, test, and package
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "dev-$env:GITHUB_SHA".Substring(0, 12)
          }
          .\windows\build.ps1 -Version $version

      - name: Upload Windows package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: omawrite-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download the Windows package
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: omawrite-windows-x64
          path: release

      - name: Create checksum
        shell: powershell
        run: |
          $zip = Get-ChildItem -LiteralPath release -Filter *.zip -File -Recurse |
            Select-Object -Single
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($zip.FullName + ".sha256") `
            -Value "$hash  $($zip.Name)" -Encoding Ascii

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem -LiteralPath release -Filter *.zip -File -Recurse |
            Select-Object -Single
          gh release create $env:GITHUB_REF_NAME `
            $zip.FullName ($zip.FullName + ".sha256") `
            --title "OmaWrite for Windows $env:GITHUB_REF_NAME" `
            --generate-notes
